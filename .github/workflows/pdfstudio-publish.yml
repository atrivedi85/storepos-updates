name: PdfStudio publish desktop update
# Builds the Windows installer and uploads it to trivedipos.com/pdfstudio (R2), latest.yml LAST.
# Run by hand only. The live latest.yml is saved as an artifact first, so it can be rolled back.
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pdfstudio
        shell: bash
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Save the live latest.yml (for rollback)
        run: |
          mkdir -p ../backup
          curl -fsS --retry 5 --retry-all-errors --retry-delay 6 https://trivedipos.com/pdfstudio/latest.yml -o ../backup/latest.yml
          cat ../backup/latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: previous-latest-yml
          path: backup/latest.yml
          retention-days: 90
      - run: npm ci --no-audit --no-fund
      - run: npm run dist
      - run: npm run prepare-upload
      - name: Upload installer and blockmap, then latest.yml last
        run: |
          V=$(node -p "require('./package.json').version")
          npx wrangler r2 object put "pdfstudio-downloads/PdfStudio-Setup-$V.exe" --file "upload/PdfStudio-Setup-$V.exe" --content-type application/octet-stream --remote
          npx wrangler r2 object put "pdfstudio-downloads/PdfStudio-Setup-$V.exe.blockmap" --file "upload/PdfStudio-Setup-$V.exe.blockmap" --content-type application/octet-stream --remote
          npx wrangler r2 object put "pdfstudio-downloads/latest.yml" --file upload/latest.yml --content-type "text/yaml" --remote
      - name: Check what people will now get
        run: curl -fsS --retry 5 --retry-all-errors --retry-delay 6 https://trivedipos.com/pdfstudio/latest.yml
