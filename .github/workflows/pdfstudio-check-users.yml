name: PdfStudio account counts (no names)
on:
  workflow_dispatch:
jobs:
  counts:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Counts only
        working-directory: pdfstudio
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cd worker
          npx wrangler d1 execute pdfstudio-db --remote --json --command "SELECT COUNT(*) AS total, SUM(CASE WHEN disabled=1 THEN 1 ELSE 0 END) AS switched_off, SUM(CASE WHEN role='admin' THEN 1 ELSE 0 END) AS admins, SUM(CASE WHEN pass_hash='ledger-desk' THEN 1 ELSE 0 END) AS from_ledger_desk, SUM(CASE WHEN pass_hash<>'ledger-desk' THEN 1 ELSE 0 END) AS old_local_only FROM users" | jq -c '.[0].results'
