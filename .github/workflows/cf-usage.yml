name: Cloudflare Worker usage (read only)
on:
  workflow_dispatch:
jobs:
  u:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          S=$(date -u -d '-24 hours' +%Y-%m-%dT%H:%M:%SZ); E=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          Q='{"query":"query($a:String!,$s:Time!,$e:Time!){viewer{accounts(filter:{accountTag:$a}){workersInvocationsAdaptive(limit:100,filter:{datetime_geq:$s,datetime_leq:$e}){sum{requests errors subrequests} dimensions{scriptName status}}}}}","variables":{"a":"'$A'","s":"'$S'","e":"'$E'"}}'
          curl -sS -H "Authorization: Bearer $T" -H "Content-Type: application/json" https://api.cloudflare.com/client/v4/graphql -d "$Q" | jq -r '.errors // empty, (.data.viewer.accounts[0].workersInvocationsAdaptive[]? | "\(.dimensions.scriptName) \(.dimensions.status) requests=\(.sum.requests) errors=\(.sum.errors) sub=\(.sum.subrequests)")'
