name: PdfStudio web
on:
  push:
    branches: [main]
    paths: ['pdfstudio/**', '.github/workflows/pdfstudio.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdfstudio
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the web editor
        run: node build.mjs
      - name: Put PdfStudio online at Cloudflare (trivedipos.com/pdfstudio)
        working-directory: pdfstudio/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
