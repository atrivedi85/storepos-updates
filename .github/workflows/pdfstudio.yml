name: PdfStudio web
on:
  push:
    branches: [main]
    paths: ['pdfstudio/**', '.github/workflows/pdfstudio.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdfstudio
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the web editor
        run: node build.mjs
      - name: Put PdfStudio online at Cloudflare (trivedipos.com/pdfstudio)
        working-directory: pdfstudio/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Hand the email key (GitHub secret RESEND_API_KEY) to PdfStudio, if it is set
        working-directory: pdfstudio/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY >/dev/null && echo "Email key handed over."; else echo "No RESEND_API_KEY secret yet - emails stay off."; fi
