name: PdfStudio installer (build only)
# Builds the Windows installer so you can test it. It does NOT publish anything:
# the file appears under this run's "Artifacts". Publishing to customers is a separate, deliberate step.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pdfstudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build the installer
        run: npm run dist
      - name: Collect the files that would be uploaded
        run: npm run prepare-upload
      - uses: actions/upload-artifact@v4
        with:
          name: PdfStudio-installer
          path: pdfstudio/upload/*
          retention-days: 30
