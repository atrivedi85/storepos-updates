name: App download storage (KV) maintenance
on:
  workflow_dispatch:
    inputs:
      action:
        description: "list | delete-apk | delete-old-branches (removes trivedi-tv and ci-logs-iptv-surfer)"
        default: list
permissions:
  contents: write
jobs:
  kv:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the old IPTV Surfer branches
        if: inputs.action == 'delete-old-branches'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for b in trivedi-tv ci-logs-iptv-surfer; do gh api -X DELETE repos/$GITHUB_REPOSITORY/git/refs/heads/$b && echo "deleted $b" || true; done
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: KV ${{ inputs.action }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          NS=3a131d80955e4eed9b4bdb5ef977e562
          if [ "${{ inputs.action }}" = "delete-apk" ]; then npx -y wrangler@3 kv key delete surfer.apk --namespace-id $NS; fi
          npx -y wrangler@3 kv key list --namespace-id $NS | grep -v '"code:' || true
