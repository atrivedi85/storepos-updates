name: App download storage (KV) maintenance
on:
  workflow_dispatch:
    inputs:
      action:
        description: "list = show what is stored, delete-apk = remove the stored APK"
        default: list
jobs:
  kv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: KV ${{ inputs.action }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          NS=3a131d80955e4eed9b4bdb5ef977e562
          if [ "${{ inputs.action }}" = "delete-apk" ]; then npx -y wrangler@3 kv key delete surfer.apk --namespace-id $NS; fi
          npx -y wrangler@3 kv key list --namespace-id $NS | grep -v '"code:' || true
