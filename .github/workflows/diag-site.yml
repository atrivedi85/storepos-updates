name: Diagnose site from GitHub (temporary)
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://trivedipos.com/pdfstudio/latest.yml
          for i in 1 2 3 4 5 6; do
            a=$(curl -s -o /dev/null -w "%{http_code}" "$U"); b=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0 Chrome/130" "$U"); c=$(curl -s -o /dev/null -w "%{http_code}" -A "pdfstudio-ci" "$U"); d=$(curl -s -o /dev/null -w "%{http_code}" "$U?x=$i")
            echo "try $i: plain=$a browserUA=$b customUA=$c plain+query=$d"; sleep 2
          done
