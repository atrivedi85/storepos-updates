name = "storepos-sync"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true
routes = [
  { pattern = "trivedipos.com", custom_domain = true },
  { pattern = "www.trivedipos.com", custom_domain = true }
]

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# The web back office (the POS screens + web-shim.js), copied in by the deploy workflow.
[assets]
directory = "./public"
not_found_handling = "none"
