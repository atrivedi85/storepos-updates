plugins { id 'com.android.application' }

android {
    namespace 'com.storeposapp.pos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.storeposapp.pos'
        minSdk 24
        targetSdk 35
        versionCode 100 + ((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName System.getenv('VERSION_NAME') ?: '1.0'
    }

    signingConfigs {
        release {
            def ks = System.getenv('KS_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KS_PASS')
                keyAlias System.getenv('KS_ALIAS') ?: 'storepos'
                keyPassword System.getenv('KS_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KS_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { checkReleaseBuilds false; abortOnError false }
}
