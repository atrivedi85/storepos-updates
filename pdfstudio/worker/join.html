<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PdfStudio - Create your account</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6fb;--card:#fff;--fg:#1b2030;--mut:#5b6478;--acc:#3b6df0;--err:#c62828;--bd:#d9deea}
@media(prefers-color-scheme:dark){:root{--bg:#161a26;--card:#1e2230;--fg:#e8ebf4;--mut:#9aa3b8;--acc:#6b93ff;--err:#ff7b72;--bd:#323955}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,Segoe UI,sans-serif}
main{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:28px;width:min(420px,calc(100vw - 32px))}
h1{margin:0 0 4px;font-size:22px}p{color:var(--mut);margin:0 0 18px}
label{display:block;font-size:13px;margin:12px 0 4px;color:var(--mut)}
input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--fg);font:inherit}
button{margin-top:18px;width:100%;padding:11px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--err);min-height:1.4em;margin-top:10px;font-size:14px}
a{color:var(--acc)}
</style></head><body><main>
<h1 id="title">Create your PdfStudio account</h1>
<p id="sub">Checking your invite…</p>
<form id="f" hidden>
  <div id="uwrap"><label for="u">Username</label><input id="u" autocomplete="username" maxlength="32" placeholder="letters, numbers, . - _"></div>
  <label for="p1">Password (10+ characters)</label><input id="p1" type="password" autocomplete="new-password">
  <label for="p2">Repeat password</label><input id="p2" type="password" autocomplete="new-password">
  <button id="go">Create account</button>
</form>
<div id="err"></div>
<p id="done" hidden>Account ready. <a href="/pdfstudio/">Go to PdfStudio</a> and sign in with your username and password.</p>
</main>
<script>
const $=(id)=>document.getElementById(id);
const token=new URLSearchParams(location.search).get('token')||'';
let reset=false;
(async()=>{
  const r=await fetch('/pdfstudio/api/invite-info?token='+encodeURIComponent(token));
  const j=await r.json();
  if(!r.ok){$('sub').textContent='';$('err').textContent=j.error;return;}
  reset=j.reset;
  $('sub').textContent=reset?'Choose a new password for '+j.email+'.':'Invited as '+j.email+'.';
  if(reset){$('title').textContent='Reset your password';$('uwrap').hidden=true;$('go').textContent='Set password';}
  $('f').hidden=false;
})();
$('f').onsubmit=async(e)=>{
  e.preventDefault();$('err').textContent='';
  if($('p1').value!==$('p2').value){$('err').textContent='Passwords do not match.';return;}
  $('go').disabled=true;
  const r=await fetch('/pdfstudio/api/accept-invite',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,username:$('u').value,password:$('p1').value})});
  const j=await r.json();
  $('go').disabled=false;
  if(!r.ok){$('err').textContent=j.error;return;}
  $('f').hidden=true;$('sub').textContent='';$('done').hidden=false;
};
</script></body></html>
