<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>PdfStudio - Sign in</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6fb;--card:#fff;--fg:#1b2030;--mut:#5b6478;--acc:#3b6df0;--err:#c62828;--bd:#d9deea}
@media(prefers-color-scheme:dark){:root{--bg:#161a26;--card:#1e2230;--fg:#e8ebf4;--mut:#9aa3b8;--acc:#6b93ff;--err:#ff7b72;--bd:#323955}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,Segoe UI,sans-serif}
main{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:28px;width:min(400px,calc(100vw - 32px))}
h1{margin:0 0 4px;font-size:22px}p{color:var(--mut);margin:0 0 14px}
input{display:block;width:100%;box-sizing:border-box;padding:10px 12px;margin-bottom:10px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--fg);font:inherit}
button{width:100%;padding:11px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--err);min-height:1.4em;margin:2px 0 10px;font-size:14px}
small{display:block;margin-top:14px;color:var(--mut)}
[hidden]{display:none!important}
</style></head><body><main>
<h1>Sign in to PdfStudio</h1>
<p id="sub">Use your Ledger Desk username and password.</p>
<form id="f">
  <div id="pwStep">
    <input id="u" autocomplete="username" placeholder="Username" autocapitalize="off" spellcheck="false" autofocus>
    <input id="p" type="password" autocomplete="current-password" placeholder="Password">
  </div>
  <div id="codeStep" hidden>
    <input id="c" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" maxlength="8">
  </div>
  <div id="err"></div>
  <button id="go">Sign in</button>
</form>
<small>PdfStudio uses the same account as Ledger Desk. If you can sign in to Ledger Desk, you can sign in here. Your password is never sent to PdfStudio.</small>
</main>
<script>
const $=(id)=>document.getElementById(id);
const AUTH_ITER=200000;
// Same derived value Ledger Desk itself sends (the password is not sent anywhere).
async function authFor(username,password){
  const te=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',te.encode(password),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:te.encode('ledgerdesk-auth|'+String(username).trim().toLowerCase()),iterations:AUTH_ITER},base,256);
  let s='';for(const b of new Uint8Array(bits))s+=String.fromCharCode(b);return btoa(s);
}
const post=async(path,body)=>{const r=await fetch('/pdfstudio/api/'+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});return{ok:r.ok,j:await r.json().catch(()=>({}))};};
let ticket=null;
$('f').onsubmit=async(e)=>{
  e.preventDefault();
  const err=$('err'),go=$('go');
  err.textContent='';go.disabled=true;
  try{
    let r;
    if(ticket){r=await post('login/2fa',{ticket,code:$('c').value});}
    else{
      if(!crypto||!crypto.subtle){err.textContent='This browser cannot sign in securely. Use Chrome or Edge over https.';go.disabled=false;return;}
      r=await post('login',{username:$('u').value,auth:await authFor($('u').value,$('p').value)});
    }
    if(r.ok&&r.j.need2fa){
      ticket=r.j.ticket;$('pwStep').hidden=true;$('codeStep').hidden=false;$('c').focus();
      $('sub').textContent=r.j.need2fa==='email'?'We emailed a 6-digit code to '+(r.j.to||'you')+'. Enter it here.':'Enter the 6-digit code from your authenticator app.';
      go.disabled=false;return;
    }
    if(r.ok){location.reload();return;}
    err.textContent=r.j.error||'Sign-in failed.';
    if(ticket&&/Sign in again|Too many/.test(r.j.error||'')){ticket=null;$('pwStep').hidden=false;$('codeStep').hidden=true;$('p').value='';}
  }catch{err.textContent='Cannot reach the server. Check your internet connection.';}
  go.disabled=false;
};
</script><script src="/pdfstudio/apps.js" defer></script></body></html>
